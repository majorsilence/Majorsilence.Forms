name: CI

# Build / test gate. Runs on every PR and on demand.
#
# Packaging and release live in release.yml (NuGet packages + the migrator tool) —
# this workflow intentionally does NOT pack or upload artifacts, so the two don't
# duplicate each other.
#
# Note: there is deliberately no `dotnet format --verify-no-changes` gate. The repo's
# hand-maintained style (e.g. space-before-paren) does not match what `dotnet format`
# would impose, so that check reports thousands of pre-existing findings and cannot pass
# without a disruptive repo-wide reformat. Re-add it only after committing to that reformat.

on: [pull_request, workflow_dispatch]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Builds the whole solution in Release on every OS — this is the cross-platform
      # compile gate (Release also turns on TreatWarningsAsErrors + doc generation).
      - name: Build
        run: dotnet build --configuration Release

      # The CJK font-fallback tests (DrawString / AddString / TextRenderer) assert that a
      # non-Latin string renders as real glyphs rather than a row of identical tofu boxes. That
      # can only work if a CJK face is actually installed for SkiaSharp to fall back TO — the
      # Windows and macOS runners ship one, ubuntu-latest ships none, so those tests saw tofu and
      # failed. This is the whole point of the Linux test job added alongside this matrix.
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # ── Test matrix ────────────────────────────────────────────────────────────────────────
      #
      # Two things vary independently and both have bitten this repo, so both are gated on every
      # platform that can express them:
      #
      #   CHROME. macOS is the ONLY platform that uses system decorations; every other one draws the
      #   library's own title bar. Anything touching the caption -- client-area geometry, hit-testing
      #   near the top of a form, tab order through the caption buttons, the automation tree -- takes a
      #   different path on each side. MF_FORCE_CUSTOM_CHROME makes a macOS process take the other one,
      #   so both are covered rather than whichever the runner happens to be.
      #
      #   SCALE. MF_HEADLESS_SCALE makes the headless backend report a scaled display, so the
      #   logical->device conversions are exercised instead of being identity as they are at scale 1 --
      #   which is how a coordinate bug sits undetected until it meets a real HiDPI screen.
      #
      # Every run below is the whole solution EXCEPT the migrator suite, which takes over ten minutes
      # (it builds generated projects) against roughly eight seconds for everything else, and is
      # OS-agnostic besides. It runs once, in the full Windows pass. Windows is also the only platform
      # where the UI Automation project has anything to run.
      #
      # `!cancelled()` on each: without it a failure in one step skips the rest, so a single red gate
      # hides every gate after it. That is not hypothetical -- the HiDPI gate was skipped on two
      # consecutive PRs while the plain run was red, and the HiDPI-only failure underneath (EVT-39)
      # cost a round trip each time to find.
      #
      # Collections run serially in the scaled runs: a test that opens a modal dialog picks its owner
      # out of the global Application.OpenForms and in parallel can pick another test's window and
      # block forever. That is a test-isolation problem rather than a product one, but it makes a
      # parallel run hang, so these gates do not rely on it.

      # The one full pass: migrator + UI Automation + everything else, on the platform that can run all
      # of it. Custom chrome, scale 1.
      - name: Test (Windows, full solution)
        if: runner.os == 'Windows'
        run: dotnet test --configuration Release --no-build

      - name: Test (Windows, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          MF_HEADLESS_SCALE: '2'
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"
          -- xunit.parallelizeTestCollections=false

      # Linux draws the library's own chrome, like Windows, and had no test coverage at all before
      # this -- the build step alone proved only that it compiles.
      - name: Test (Linux, custom chrome, scale 1)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"

      - name: Test (Linux, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          MF_HEADLESS_SCALE: '2'
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"
          -- xunit.parallelizeTestCollections=false

      # macOS runs both sides of the chrome branch: its own system decorations, and the custom chrome
      # every other platform gets. The system-decorations path is the shape most contributors develop
      # against and, before this, the one path nothing tested.
      - name: Test (macOS, system decorations, scale 1)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"

      - name: Test (macOS, system decorations, scale 2)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          MF_HEADLESS_SCALE: '2'
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"
          -- xunit.parallelizeTestCollections=false

      - name: Test (macOS, custom chrome, scale 1)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          MF_FORCE_CUSTOM_CHROME: '1'
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"

      - name: Test (macOS, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          MF_FORCE_CUSTOM_CHROME: '1'
          MF_HEADLESS_SCALE: '2'
        run: >-
          dotnet test --configuration Release --no-build
          --filter "FullyQualifiedName!~Migrator"
          -- xunit.parallelizeTestCollections=false

      # API gap gate. Compares both reimplemented surfaces -- Majorsilence.Forms.Drawing against
      # System.Drawing.Common, and Majorsilence.Forms against System.Windows.Forms -- and fails if
      # either gap set grew since its committed baseline. Reflection-only, so it runs anywhere despite
      # both upstream assemblies being Windows-only at runtime. The point is that the previous
      # hand-written audits in COMPATIBILITY_MATRIX.md went stale within a release; these cannot.
      # Closing gaps never fails the build -- it just prints them and asks for the baseline to be
      # regenerated. Linux only: the result is platform-independent, so running it three times adds
      # nothing. See docs/gdi-gap-plan.md and docs/winforms-gap-plan.md.
      - name: API gap check
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet run --project tools/Majorsilence.Forms.ApiDiff --configuration Release --no-build -- --check

  # .NET Framework (net472) consumer smoke test.
  #
  # Majorsilence.Forms / Majorsilence.Forms.Telerik now also ship a netstandard2.0 target so classic
  # .NET Framework 4.7.2+ apps can consume the core. tests/Majorsilence.Forms.NetFxSmoke is a net472
  # project that references the core and exercises the netstandard2.0-only code paths -- most
  # importantly ComponentResourceManager's AppDomain.AssemblyResolve fallback (the AssemblyLoadContext
  # path on the .NET TFMs). It is deliberately NOT in Majorsilence.Forms.slnx: `dotnet test` on the
  # solution would abort on the Linux/macOS legs (no mono host for net472). It only needs Windows.
  netfx-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build + run the net472 consumer smoke test
        run: dotnet test tests/Majorsilence.Forms.NetFxSmoke/Majorsilence.Forms.NetFxSmoke.csproj --configuration Release

  # Wasm publish + boot smoke test gate.
  #
  # samples/Gallery.Wasm is part of Majorsilence.Forms.slnx, so the `build` job above
  # already compiles it with `dotnet build` on all 3 OSes -- but that's not sufficient.
  # A Microsoft.NET.Sdk.WebAssembly project can `build` fine and still fail to `publish` a
  # working wasm bundle: `dotnet publish` is what actually runs the wasm-tools pipeline
  # (emcc/wasm-opt native linking, IL trimming, brotli/gzip compression of the _framework
  # assets) that `build` skips entirely. This job runs that publish, then goes one step
  # further and boots the published bundle in a real (headless) browser, since a
  # successful publish still doesn't prove the resulting app actually runs.
  #
  # This gets its own job rather than living in the `build` matrix above because it only
  # needs to run once: the published wasm+wwwroot output is OS-agnostic (same JS/wasm
  # files regardless of which OS ran `dotnet publish`), so repeating it across all 3 OSes
  # the way the native build needs to would just be slower CI for no extra coverage.
  # ubuntu-latest is used since it's the cheapest runner and headless Chromium (used for
  # the smoke test below) is most at home there.
  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Not preinstalled on GitHub-hosted runners -- required for `dotnet publish` below
      # to be able to run the wasm-tools IL-linking/packaging pipeline at all.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # The real gate: this is the first point in CI that exercises wasm-tools, since
      # `dotnet build` (in the `build` job above) never touches it.
      - name: Publish Gallery.Wasm
        run: dotnet publish samples/Gallery.Wasm/Gallery.Wasm.csproj --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # .github/scripts is CI-only tooling: a standalone package.json (Playwright), not
      # referenced by Majorsilence.Forms.slnx or any shipping project.
      - name: Install smoke-test dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Install headless Chromium
        working-directory: .github/scripts
        run: npx playwright install --with-deps chromium

      # Serves the published wwwroot with Python's stdlib http.server (lowest-friction
      # static file host available on the runner -- no extra package needed) and loads it
      # in headless Chromium via wasm-smoke-test.mjs, which waits for the <canvas>
      # element Avalonia.Browser renders into and fails on any unexpected console/page
      # error during boot. This is a smoke check, not a full E2E suite: one page load,
      # one known element, no JS errors.
      - name: Wasm boot smoke test (headless Chromium)
        working-directory: samples/Gallery.Wasm/bin/Release/net10.0-browser/publish/wwwroot
        run: |
          python3 -m http.server 8834 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:8834/index.html -o /dev/null
          node "$GITHUB_WORKSPACE/.github/scripts/wasm-smoke-test.mjs" http://127.0.0.1:8834/index.html

      # The self-contained static site (index.html + _framework/). Handy for a reviewer to
      # download and serve locally; release.yml builds its own copy for the GitHub Release.
      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        with:
          name: gallery-wasm
          path: samples/Gallery.Wasm/bin/Release/net10.0-browser/publish/wwwroot
          if-no-files-found: error

  # Android compile gate.
  #
  # samples/Gallery.Android and Majorsilence.Forms.Avalonia's net10.0-android TFM row are both deliberately
  # kept out of Majorsilence.Forms.slnx / out of that row's default TargetFrameworks (see the comments on
  # those two csproj files) specifically so the `build` job above -- which has no `android` workload
  # installed -- never touches net10.0-android. Unlike wasm-tools, the android workload's reference
  # assemblies are required just to *compile* against net10.0-android, not only to publish, so this job
  # (unlike the wasm one) has to install the workload before even a plain `dotnet build` will succeed.
  # No device/emulator here, so this only proves the APK builds, not that it boots.
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install android workload
        run: dotnet workload install android

      # `publish` rather than `build` so it also runs aapt/zipalign/apksigner and produces the
      # installable APK + AAB. With no release keystore configured these are signed with the .NET
      # Android debug key -- sideloadable, not Play-Store uploadable. EnableAndroidTarget=true opts
      # Majorsilence.Forms.Avalonia's net10.0-android TFM row back in (see that csproj).
      - name: Publish Gallery.Android
        run: >-
          dotnet publish samples/Gallery.Android/Gallery.Android.csproj
          -p:EnableAndroidTarget=true --configuration Release
          "-p:AndroidPackageFormats=apk%3Baab"

      - name: Upload Gallery.Android APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: |
            samples/Gallery.Android/bin/Release/net10.0-android/*-Signed.apk
            samples/Gallery.Android/bin/Release/net10.0-android/*-Signed.aab
          if-no-files-found: error

  # iOS compile gate.
  #
  # samples/Gallery.iOS and Majorsilence.Forms.Avalonia's net10.0-ios TFM row are both deliberately kept
  # out of Majorsilence.Forms.slnx / out of that row's default TargetFrameworks, same as the Android row
  # above and for the same compile-time-reference-assembly reason -- except here there is no cross-OS
  # path at all: the `ios` workload only installs on macOS (Apple's toolchain, not just a nice-to-have,
  # is a hard requirement), unlike `android`, which installs and builds on any OS. This is therefore the
  # only job in this workflow that has to run on macos-latest instead of ubuntu-latest. No
  # simulator/device here, so this only proves the app builds, not that it boots -- and unlike every
  # other platform-specific job in this repo, this one has never actually run yet as of the change that
  # added it, so treat a first failure here as expected teething, not a regression.
  ios:
    runs-on: macos-latest
    # Gallery.iOS has never compiled anywhere yet (see its csproj header). Until Phase 4 of the
    # mobile work gets it green, a failure here must not block PRs -- it is still informational.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install ios workload
        run: dotnet workload install ios

      # `dotnet build` (not publish) with a simulator RID assembles the runnable .app bundle. iOS
      # `publish` refuses a simulator RID (it targets device archives, which need an Apple cert).
      # EnableIOSTarget=true opts Majorsilence.Forms.Avalonia's net10.0-ios TFM row back in (see that csproj).
      - name: Build Gallery.iOS (simulator)
        run: >-
          dotnet build samples/Gallery.iOS/Gallery.iOS.csproj
          -p:EnableIOSTarget=true --configuration Release
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Boot the app in a simulator (smoke)
        continue-on-error: true
        run: |
          set -x
          APP=$(find samples/Gallery.iOS/bin/Release -name 'Gallery.iOS.app' -type d | head -n1)
          xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted "$APP"
          xcrun simctl launch --console-pty booted com.majorsilence.gallery &
          sleep 15
          xcrun simctl spawn booted log show --last 20s --predicate 'processImagePath CONTAINS "Gallery.iOS"' || true

      - name: Zip the simulator .app
        run: |
          APP=$(find samples/Gallery.iOS/bin/Release -name 'Gallery.iOS.app' -type d | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" gallery-ios-simulator.zip

      - name: Upload Gallery.iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ios
          path: gallery-ios-simulator.zip
          if-no-files-found: error

  # Template smoke: pack Majorsilence.Forms.Templates, install it, scaffold a project the two
  # supported ways (desktop-only, and with the Android + WASM heads) and build them. This is the
  # first automated coverage of `dotnet new majorsilenceforms` -- it previously had only a manual
  # recipe in the template README. The scaffolded app restores the *published* Majorsilence.Forms
  # packages from nuget.org (the version pinned in template.json), not this branch's build.
  template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install android + wasm workloads
        run: dotnet workload install android wasm-tools

      - name: Pack and install the template
        run: |
          set -euo pipefail
          dotnet pack tools/Majorsilence.Forms.Templates/Majorsilence.Forms.Templates.csproj -c Release -o "$RUNNER_TEMP/tpl-nupkg"
          dotnet new install "$RUNNER_TEMP/tpl-nupkg/"Majorsilence.Forms.Templates.*.nupkg

      - name: Scaffold + build the desktop-only default
        run: |
          set -euo pipefail
          dotnet new majorsilenceforms -o "$RUNNER_TEMP/plain" -n Smoke.App
          dotnet build "$RUNNER_TEMP/plain/Smoke.App.slnx"

      - name: Scaffold + build with the Android and WASM heads
        run: |
          set -euo pipefail
          dotnet new majorsilenceforms -o "$RUNNER_TEMP/mobile" -n Smoke.App --IncludeAndroid --IncludeWasm
          dotnet build "$RUNNER_TEMP/mobile/Smoke.App.slnx"
