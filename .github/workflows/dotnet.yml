name: CI

# Build / test gate. Runs on every PR and on demand.
#
# What each step DOES lives in build/build.cs (Cake.Sdk), as a named target: this file keeps only what
# GitHub Actions has to own -- triggers, the runner matrix, setup-dotnet, artifact upload/download and the
# emulator runner. To reproduce a step locally, run the same target:
#
#     dotnet build/build.cs -- --target=Test --shape=scale2
#
# The comments on each target in build.cs carry the reasoning that used to live here (why these workload pins,
# why these test shapes, why EnableAndroidTarget and not the EnableMobileHeads umbrella, ...).
#
# Real releases live in release.yml (version injection + the draft GitHub Release, and its PR-time pack only
# fires on PRs that touch packable paths) and publishing in publish-nuget.yml. The `pack` job here is the plain
# convenience artifact: every CI run, whatever changed, uploads installable .nupkg/.snupkg files (e.g. to test
# Majorsilence.Forms.Gtk4 against a real app). All three run the same `Pack` target, so there is one list of
# packable projects, in build/build.cs.
#
# Note: there is deliberately no `dotnet format --verify-no-changes` gate. The repo's
# hand-maintained style (e.g. space-before-paren) does not match what `dotnet format`
# would impose, so that check reports thousands of pre-existing findings and cannot pass
# without a disruptive repo-wide reformat. Re-add it only after committing to that reformat.

on: [pull_request, workflow_dispatch]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# One shell everywhere: windows-latest would otherwise default to PowerShell, which has bitten this repo
# before (`ls -lh` is not a PowerShell command) and quotes arguments differently.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Cake.Sdk (build/build.cs) needs the .NET 10 SDK or later to run at all, so setup-dotnet stays here.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      # The cross-platform compile gate: the whole solution in Release (which turns on TreatWarningsAsErrors
      # and doc generation). On Windows the target also installs the android workload first; see
      # EffectiveWorkloads in build.cs for why SDK 11 makes that necessary.
      - name: Build
        run: dotnet build/build.cs -- --target=Build

      - name: Install CJK and emoji fonts (Linux)
        if: runner.os == 'Linux'
        run: dotnet build/build.cs -- --target=Fonts

      # ── Test matrix ──────────────────────────────────────────────────────────────────────────────────
      #
      # The shapes (chrome x scale x runtime) are defined in build.cs; each is its own step here so a red
      # shape is visible in the run's UI. `!cancelled()` on each: without it a failure in one step skips the
      # rest, so a single red gate hides every gate after it. That is not hypothetical -- the HiDPI gate was
      # skipped on two consecutive PRs while the plain run was red, and the HiDPI-only failure underneath
      # (EVT-39) cost a round trip each time to find.
      #
      # Every shape is the whole solution EXCEPT the migrator suite, which takes over ten minutes. It runs
      # once, in the full Windows pass, which is also the only platform where the UI Automation project has
      # anything to run.

      # Custom chrome, scale 1.
      - name: Test (Windows, full solution)
        if: runner.os == 'Windows'
        run: dotnet build/build.cs -- --target=Test --shape=full

      - name: Test (Windows, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: dotnet build/build.cs -- --target=Test --shape=scale2

      # Linux draws the library's own chrome, like Windows, and had no test coverage at all before this --
      # the build step alone proved only that it compiles.
      - name: Test (Linux, custom chrome, scale 1)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet build/build.cs -- --target=Test --shape=default

      - name: Test (Linux, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet build/build.cs -- --target=Test --shape=scale2

      # macOS runs both sides of the chrome branch: its own system decorations, and the custom chrome
      # every other platform gets.
      - name: Test (macOS, system decorations, scale 1)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: dotnet build/build.cs -- --target=Test --shape=default

      - name: Test (macOS, system decorations, scale 2)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: dotnet build/build.cs -- --target=Test --shape=scale2

      - name: Test (macOS, custom chrome, scale 1)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: dotnet build/build.cs -- --target=Test --shape=custom-chrome

      - name: Test (macOS, custom chrome, scale 2)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: dotnet build/build.cs -- --target=Test --shape=custom-chrome-scale2

      # net11.0 rows are compiled with runtime async; only running the suite on net11.0 exercises that code.
      # Linux only: what this gates is the compiler/runtime change, and the shapes above already cover the
      # platform differences.
      - name: Test (Linux, net11.0 runtime async)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet build/build.cs -- --target=Test --shape=net11

      # API gap gate: fails if either reimplemented surface's gap set grew since its committed baseline.
      # Linux only: the result is platform-independent, so running it three times adds nothing.
      - name: API gap check
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: dotnet build/build.cs -- --target=ApiGap

  # Pack the shipping NuGet packages and upload them as build artifacts, so every CI run yields installable
  # .nupkg/.snupkg files without waiting for a release. Runs on every PR regardless of what changed.
  #
  # release.yml also packs on PRs -- but only ones that touch src/**, tools/** or the Directory.* props, and it
  # injects a release version for the draft GitHub Release. This job is the plain "grab the packages" artifact.
  #
  # Three rows because the Pack target packs the share of the packages THIS OS can: macOS packs
  # Majorsilence.Forms.Essentials and Majorsilence.Forms.Avalonia (android + ios + desktop rows in one package;
  # iOS only compiles on macOS); Linux the cross-platform ones; Windows the net*-windows ones
  # (UseWindowsForms/UseWPF), which compile to an empty IsPackable=false stub elsewhere. The project lists and
  # the workload profile each row needs are in build/build.cs.
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nuget-packages
            workloads: android
          - os: macos-latest
            artifact: nuget-packages-macos
            workloads: mac-pack
          - os: windows-latest
            artifact: nuget-packages-windows
            workloads: none

    runs-on: ${{ matrix.os }}
    # The macOS row is informational on PRs for the same reason the `ios` job is (flaky runner, few
    # green runs); the release workflows pack it as a hard requirement.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Pack
        run: dotnet build/build.cs -- --target=Pack --workloads=${{ matrix.workloads }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: nupkg/*.snupkg
          if-no-files-found: ignore

  # Benchmarks: a smoke run and the allocation regression gate. The per-PR gate; benchmarks.yml runs the full
  # suite on demand for timings. See the Benchmarks target in build/build.cs and docs/performance-plan.md.
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install CJK and emoji fonts
        run: dotnet build/build.cs -- --target=Fonts

      - name: Smoke-run every benchmark and run the allocation gate
        run: dotnet build/build.cs -- --target=Benchmarks

  # .NET Framework (net472) consumer smoke test. Needs only Windows; see the NetFxSmoke target.
  netfx-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build + run the net472 consumer smoke test
        run: dotnet build/build.cs -- --target=NetFxSmoke

  # Wasm publish + boot smoke test gate.
  #
  # samples/Gallery.Wasm is part of Majorsilence.Forms.slnx, so the `build` job already compiles it -- but
  # that's not sufficient. A Microsoft.NET.Sdk.WebAssembly project can `build` fine and still fail to
  # `publish` a working wasm bundle: `dotnet publish` is what runs the wasm-tools pipeline. This job runs that
  # publish (the WasmPublish target), then goes one step further and boots the published bundle in a real
  # (headless) browser, since a successful publish still doesn't prove the resulting app actually runs.
  #
  # Its own job rather than part of the `build` matrix because the published output is OS-agnostic, so
  # repeating it across all 3 OSes would just be slower CI for no extra coverage. ubuntu-latest is the cheapest
  # runner and headless Chromium is most at home there.
  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      # Installs the wasm workload profile first (see the "wasm" entry in build/build.cs for why it names two
      # ids), then publishes. The first point in CI that exercises wasm-tools.
      - name: Publish Gallery.Wasm
        run: dotnet build/build.cs -- --target=WasmPublish --workloads=wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # .github/scripts is CI-only tooling: a standalone package.json (Playwright), not
      # referenced by Majorsilence.Forms.slnx or any shipping project.
      - name: Install smoke-test dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Install headless Chromium
        working-directory: .github/scripts
        run: npx playwright install --with-deps chromium

      # Serves the published wwwroot with Python's stdlib http.server (lowest-friction static file host
      # available on the runner -- no extra package needed) and loads it in headless Chromium via
      # wasm-smoke-test.mjs, which waits for the <canvas> element Avalonia.Browser renders into and fails on
      # any unexpected console/page error during boot. This is a smoke check, not a full E2E suite: one page
      # load, one known element, no JS errors.
      - name: Wasm boot smoke test (headless Chromium)
        working-directory: samples/Gallery.Wasm/bin/Release/net10.0-browser/publish/wwwroot
        run: |
          python3 -m http.server 8834 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:8834/index.html -o /dev/null
          node "$GITHUB_WORKSPACE/.github/scripts/wasm-smoke-test.mjs" http://127.0.0.1:8834/index.html

      # The self-contained static site (index.html + _framework/). Handy for a reviewer to
      # download and serve locally; release.yml builds its own copy for the GitHub Release.
      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        with:
          name: gallery-wasm
          path: samples/Gallery.Wasm/bin/Release/net10.0-browser/publish/wwwroot
          if-no-files-found: error

      # The browser-head checks (samples/Gallery.Wasm/ModalCheckForm.cs, issue #406) against the same
      # bundle: each blocking modal call must THROW naming its async form, each awaited one must RETURN,
      # the accessibility DOM must mirror the check form's controls, popups and live-region announcements
      # step by step, the rendering checks' screenshots must show what they ask for (owner drawn, dialog
      # frame whole, OK click answers), and nothing may hang. --expect
      # compares every check with the table at the top of modal-check.mjs and exits non-zero on any
      # difference. It drives the google-chrome preinstalled on the ubuntu runner over the DevTools
      # protocol (no npm packages; it serves the bundle itself on 127.0.0.1). --no-sandbox because
      # Ubuntu 24.04's AppArmor userns restriction can refuse Chrome's sandbox on a throwaway runner.
      # Runs after the bundle upload so a failure still leaves the bundle to download and reproduce.
      - name: Browser-head checks (headless Chrome)
        timeout-minutes: 15
        env:
          CHROME: /usr/bin/google-chrome
          MF_CHECK_CHROME_ARGS: --no-sandbox
          MF_CHECK_TIMEOUT_MS: "60000"
          MF_CHECK_SCREENSHOTS: ${{ runner.temp }}/modal-check/screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/modal-check"
          "$CHROME" --version
          node samples/Gallery.Wasm/tools/modal-check.mjs \
            samples/Gallery.Wasm/bin/Release/net10.0-browser/publish/wwwroot \
            --expect --report="$RUNNER_TEMP/modal-check/report.json" \
            2>&1 | tee "$RUNNER_TEMP/modal-check/modal-check.log"

      - name: Upload browser-head check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-wasm-modal-check
          path: ${{ runner.temp }}/modal-check
          if-no-files-found: warn

  # NativeAOT smoke: a real ILC publish that links and runs (the AotSmoke target). IsAotCompatible on the core
  # libraries makes the Release build fail on a new statically-visible trim/AOT hazard, but only a real publish
  # catches a reflection call deep in a dependency or a trimmed static cctor that throws.
  #
  # continue-on-error until it has a stable track record, then promote -- same staged rollout as the
  # ios and android-smoke jobs. The always-on guard is the analyzer enforcement in the build job.
  aot-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish the NativeAOT smoke (linux-x64) and run the native binary
        run: dotnet build/build.cs -- --target=AotSmoke

  # Android compile gate.
  #
  # samples/Gallery.Android IS a member of Majorsilence.Forms.slnx, but its net10.0-android TFM only switches on
  # with EnableAndroidHead -- which Directory.Build.props derives when the `android` workload is installed, and
  # which the `build` job above (no workload on Linux) therefore never triggers: there the head compiles as an
  # empty net10.0 stub. The android workload's reference assemblies are required just to *compile* against
  # net10.0-android, so this job installs it and asks for the row explicitly (see the AndroidPublish target).
  # No device/emulator here, so this only proves the APK builds, not that it boots.
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # `publish` rather than `build` so it also runs aapt/zipalign/apksigner and produces the installable
      # APK + AAB, signed with the .NET Android debug key -- sideloadable, not Play-Store uploadable.
      - name: Publish Gallery.Android
        run: dotnet build/build.cs -- --target=AndroidPublish --workloads=android

      - name: Upload Gallery.Android APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: |
            samples/Gallery.Android/bin/Release/net10.0-android/*-Signed.apk
            samples/Gallery.Android/bin/Release/net10.0-android/*-Signed.aab
          if-no-files-found: error

  # Android emulator smoke.
  #
  # The `android` job above only proves the APK packages. The startup crash that motivated putting the
  # head in the solution (MainActivity needed an AppCompat theme) compiled and packaged fine and only
  # died on launch -- exactly the class of regression a compile gate cannot see. This job installs the
  # APK the `android` job uploaded onto a booted emulator, launches it, and fails if the process dies
  # or logcat shows a fatal exception / ANR (see .github/scripts/android-smoke-test.sh).
  #
  # Separate job, not a step in `android`: it needs KVM + a full emulator boot (slow, occasionally
  # flaky), and the compile gate should stay hard and fast. continue-on-error until it has a stable
  # track record on this runner, then promote it -- same staged rollout as the ios job.
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Download the Gallery.Android APK
        uses: actions/download-artifact@v4
        with:
          name: gallery-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot an emulator and run the smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke-test.sh apk smoke-screenshot.png

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android-smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore

  # iOS compile gate.
  #
  # samples/Gallery.iOS IS a member of Majorsilence.Forms.slnx, but (like Gallery.Android) its net10.0-ios TFM
  # only switches on with EnableIOSHead, which additionally requires the host OS to be macOS: the `ios`
  # workload only installs on macOS (Apple's toolchain is a hard requirement). Everywhere else the head
  # compiles as an empty net10.0 stub, so this is the only job here that has to run on macos-latest. The build
  # step compiles the real net10.0-ios head; the follow-up step also launches the .app in a simulator and dumps
  # its log (a smoke check, not an assertion).
  ios:
    runs-on: macos-latest
    # The head compiles and the simulator smoke step passes as of the android/ios flag split, but this
    # has only a couple of green runs behind it on a flaky runner (macOS + simulator boot). Kept
    # informational until it is proven stable across several PRs, then promote to a hard gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The ios workload profile needs SDK 10 (see its comment in build/build.cs); without this the SDK 11
      # the runner image ships wins. Net11 rows switch themselves off on SDK 10 (Directory.Build.props).
      - name: Run on SDK 10
        run: |
          jq '.sdk = {"version": "10.0.100", "rollForward": "latestFeature"}' global.json > global.json.tmp
          mv global.json.tmp global.json
          dotnet --version

      # Installs the pinned ios workload (see the "ios" profile in build/build.cs), then builds for the
      # simulator RID, which assembles the runnable .app bundle.
      - name: Build Gallery.iOS (simulator)
        run: dotnet build/build.cs -- --target=IosBuild --workloads=ios

      - name: Boot the app in a simulator (smoke)
        continue-on-error: true
        run: |
          set -x
          APP=$(find samples/Gallery.iOS/bin/Release -name 'Gallery.iOS.app' -type d | head -n1)
          xcrun simctl boot "iPhone 16" || xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted "$APP"
          xcrun simctl launch --console-pty booted com.majorsilence.gallery &
          sleep 15
          xcrun simctl spawn booted log show --last 20s --predicate 'processImagePath CONTAINS "Gallery.iOS"' || true

      - name: Zip the simulator .app
        run: dotnet build/build.cs -- --target=SampleIos

      - name: Upload Gallery.iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ios
          path: sample-out/gallery-ios-simulator.zip
          if-no-files-found: error

  # Template smoke: pack Majorsilence.Forms.Templates, install it, scaffold a project the two supported ways
  # (desktop-only, and with the Android + WASM heads) and build them -- the Template target. This is the first
  # automated coverage of `dotnet new majorsilenceforms`. The scaffolded app restores the *published*
  # Majorsilence.Forms packages from nuget.org (the version pinned in template.json), not this branch's build.
  template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack, install and build the template
        run: dotnet build/build.cs -- --target=Template --workloads=template
