name: Release Packages

# Builds the Majorsilence.Forms NuGet packages -- including majorsilence-migrate,
# which ships as a .NET tool package (Majorsilence.Forms.Migrator) and nothing else.
# Runs on a version tag for a real release, on demand via the Actions tab, and on
# PRs / main pushes that touch packable code as a smoke test.
#
# - Tag push (v1.2.3 or      -> packs everything, uploads artifacts, creates a
#   1.2.3)                      DRAFT GitHub Release.
# - workflow_dispatch        -> same, with an overridable version.
# - pull_request / main push -> packs only, to verify nothing is broken.
#
# Publishing to nuget.org is a SEPARATE workflow (publish-nuget.yml), triggered only when
# a human clicks "Publish release" on the draft this workflow creates -- see that file for
# the Trusted Publishing (OIDC) setup. This workflow never has nuget.org credentials.
#
# What each job DOES lives in build/build.cs (Cake.Sdk). Notably there is one list of packable projects, there,
# instead of the three that used to be kept in sync by hand across this file, publish-nuget.yml and dotnet.yml:
# the `Pack` target packs whichever share (cross-platform, Windows-only, macOS-only) the runner's OS can.
# The version is resolved there too (the `Version` target): a tag push uses the tag, otherwise the
# workflow_dispatch input reaches it as $PACK_VERSION, otherwise it is left to the csproj files.

on:
  push:
    # Tags always trigger a real release. (Note: path filters are intentionally
    # omitted here — combining `paths` with `tags` can cause tag pushes to be
    # skipped, and a release must never be silently filtered out.)
    #
    # BOTH spellings, because this repo has used both: v0.3 through v26.0.24 carry the
    # prefix, and everything from 26.0.24-a to 26.0.52 does not. Only 'v*' was listed, so
    # the thirteen bare tags matched nothing and released nothing -- a tag push that looks
    # exactly like a release and silently does not run is the worst shape this can fail in,
    # which is why the list is permissive rather than a rule about how to name a tag.
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.3.1). Leave blank to use the version in the csproj files.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release on tag builds

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The workflow_dispatch version, handed to build/build.cs through the environment rather than interpolated
  # into a shell line. Empty on every other trigger; a tag push is resolved from the tag itself.
  PACK_VERSION: ${{ github.event.inputs.version }}

# One shell everywhere: windows-latest would otherwise default to PowerShell (where `ls -lh` is not a valid
# command, which once failed a job whose pack had succeeded).
defaults:
  run:
    shell: bash

jobs:
  # Is this pull request nothing but a version bump? The release process opens one every time (docs/releasing.md),
  # and proving that a one-line <Version> change builds is an hour of runner time per PR. The script reads the PR's
  # file list from the API and says trivial=true only for exactly that change; anything else, or a failure to
  # ask, is trivial=false and everything runs as before. The pack and sample jobs wait on this one.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      trivial: ${{ steps.decide.outputs.trivial }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Is this only a version bump?
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/is-version-only-change.sh

  # ---------------------------------------------------------------------------
  # Pack the NuGet packages: one job per OS, each packing the share only it can.
  #
  #  - Linux: the cross-platform packages. The `android` workload stays installed because
  #    Majorsilence.Forms.Theming.Avalonia builds against Majorsilence.Forms.Avalonia.
  #  - macOS: the packages that carry a net10.0-ios row (iOS only compiles on macOS). Not
  #    continue-on-error: a release must fail loudly rather than quietly ship Essentials or Avalonia without
  #    its iOS (or Android) asset.
  #  - Windows: the net*-windows packages (UseWindowsForms/UseWPF), which the Linux job sees as empty
  #    IsPackable=false placeholders.
  # ---------------------------------------------------------------------------
  pack:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            workloads: android
            artifact: nuget-packages
            symbols: symbol-packages
          - os: macos-latest
            workloads: mac-pack
            artifact: nuget-packages-macos
            symbols: symbol-packages-macos
          - os: windows-latest
            workloads: none
            artifact: nuget-packages-windows
            symbols: symbol-packages-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Pack NuGet packages
        run: dotnet build/build.cs -- --target=Pack --workloads=${{ matrix.workloads }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbols }}
          path: nupkg/*.snupkg
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build the runnable sample heads (the ControlGallery on each mobile/web target)
  # and attach them to the release so people can try the framework without a
  # toolchain: a static WASM site, a sideloadable Android APK/AAB, an iOS
  # simulator .app. None are code-signed for distribution. File names carry the
  # release version when there is one.
  # ---------------------------------------------------------------------------
  sample-wasm:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      # The workload profile and WasmBuildNative are explained in build/build.cs: under the runner's SDK 11,
      # plain `wasm-tools` does not cover a net10.0-browser project, and without the property the publish only
      # warns and zips a site that cannot boot. Nothing here boots it; the CI `wasm` job does.
      - name: Publish and zip Gallery.Wasm
        run: dotnet build/build.cs -- --target=SampleWasm --workloads=wasm
      - uses: actions/upload-artifact@v4
        with:
          name: sample-wasm
          path: sample-out/gallery-wasm*.zip
          if-no-files-found: error

  sample-android:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish Gallery.Android
        run: dotnet build/build.cs -- --target=SampleAndroid --workloads=android
      - uses: actions/upload-artifact@v4
        with:
          name: sample-android
          path: sample-out/gallery-android*
          if-no-files-found: error

  sample-ios:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: macos-latest
    # See the ios job in dotnet.yml: the head compiles, but iOS has only a couple of green runs and
    # nobody has run it on a device. Do not fail the release for it until it is proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Same SDK 10 pin as the ios job in dotnet.yml; see the ios workload profile in build/build.cs.
      - name: Run on SDK 10
        run: |
          jq '.sdk = {"version": "10.0.100", "rollForward": "latestFeature"}' global.json > global.json.tmp
          mv global.json.tmp global.json
          dotnet --version
      - name: Build and zip Gallery.iOS (simulator)
        run: dotnet build/build.cs -- --target=SampleIos --workloads=ios
      - uses: actions/upload-artifact@v4
        with:
          name: sample-ios
          path: sample-out/gallery-ios-simulator*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Theme Studio zips. Both heads are self-contained (no .NET runtime required to
  # run them) so a reviewer can download, unzip, and try the CSS theme editor
  # (docs/samples.md) with no toolchain installed.
  #
  # ThemeStudio (Avalonia) is cross-platform, so it's published once per RID on a
  # runner that natively matches it -- win-x64 on windows-latest, linux-x64 on
  # ubuntu-latest, osx-arm64 on macos-latest (macos-latest is Apple Silicon) --
  # the same "build where it ships" approach as sample-android / sample-ios above,
  # rather than cross-publishing.
  # ---------------------------------------------------------------------------
  sample-themestudio:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Why EnableMobileHeads is forced off for this publish is in build/build.cs (SampleThemeStudio). The
      # target also does the zip: zip(1) on Unix, so the launcher keeps its executable bit, and a .NET zip on
      # Windows, which has none.
      - name: Publish and zip ThemeStudio (${{ matrix.rid }}, self-contained)
        run: dotnet build/build.cs -- --target=SampleThemeStudio --rid=${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: sample-themestudio-${{ matrix.rid }}
          path: sample-out/themestudio-*.zip
          if-no-files-found: error

  # ThemeStudio.WinForms only builds and runs on Windows (real System.Windows.Forms,
  # via Majorsilence.Forms.Theming.WinForms) -- one RID, no matrix needed.
  sample-themestudio-winforms:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and zip ThemeStudio.WinForms (win-x64, self-contained)
        run: dotnet build/build.cs -- --target=SampleThemeStudioWinForms
      - uses: actions/upload-artifact@v4
        with:
          name: sample-themestudio-winforms
          path: sample-out/themestudio-winforms-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # On a tag build, collect everything into a draft GitHub Release. Nothing here
  # touches nuget.org -- see publish-nuget.yml. A manual dispatch with a version
  # packs and uploads artifacts but does not create a release.
  # ---------------------------------------------------------------------------
  release:
    needs: [pack, sample-wasm, sample-android, sample-ios, sample-themestudio, sample-themestudio-winforms]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      # The checkout is only here for build/build.cs, which resolves the version.
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve the release version
        id: version
        run: dotnet build/build.cs -- --target=Version

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.nupkg' -o -name '*.snupkg' -o -name '*.zip' -o -name '*.tar.gz' \
            -o -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} release/ \;
          ls -lh release

      # Publishing to nuget.org happens separately, in publish-nuget.yml, triggered by
      # `release: published` -- i.e. only after a human clicks "Publish release" on the
      # draft below. Nothing in this workflow can push a package to nuget.org.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Majorsilence.Forms ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          files: release/*
