name: Release Packages

# Builds the Majorsilence.Forms NuGet packages -- including majorsilence-migrate,
# which ships as a .NET tool package (Majorsilence.Forms.Migrator) and nothing else.
# Runs on tags (v*) for a real release, on demand via the Actions tab, and on
# PRs / main pushes that touch packable code as a smoke test.
#
# - Tag push (v1.2.3)        -> packs everything, uploads artifacts, creates a
#                               DRAFT GitHub Release.
# - workflow_dispatch        -> same, with an overridable version.
# - pull_request / main push -> packs only, to verify nothing is broken.
#
# Publishing to nuget.org is a SEPARATE workflow (publish-nuget.yml), triggered only when
# a human clicks "Publish release" on the draft this workflow creates -- see that file for
# the Trusted Publishing (OIDC) setup. This workflow never has nuget.org credentials.

on:
  push:
    # Tags always trigger a real release. (Note: path filters are intentionally
    # omitted here — combining `paths` with `tags` can cause tag pushes to be
    # skipped, and a release must never be silently filtered out.)
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.3.1). Leave blank to use the version in the csproj files.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create the GitHub Release on tag builds

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Cross-platform packages that produce shipped NuGet packages — packed on Linux.
  # Keep this in sync with PACKABLE_PROJECTS in publish-nuget.yml and dotnet.yml (the `pack` job).
  PACKABLE_PROJECTS: >-
    src/Majorsilence.Forms/Majorsilence.Forms.csproj
    src/Majorsilence.Forms.Avalonia/Majorsilence.Forms.Avalonia.csproj
    src/Majorsilence.Forms.Headless/Majorsilence.Forms.Headless.csproj
    src/Majorsilence.Forms.Uno/Majorsilence.Forms.Uno.csproj
    src/Majorsilence.Forms.Gtk4/Majorsilence.Forms.Gtk4.csproj
    src/Majorsilence.Forms.Telerik/Majorsilence.Forms.Telerik.csproj
    src/Majorsilence.Forms.Drawing.Common/Majorsilence.Forms.Drawing.Common.csproj
    src/Majorsilence.Forms.WebDriver/Majorsilence.Forms.WebDriver.csproj
    src/Majorsilence.Forms.Wpf/Majorsilence.Forms.Wpf.csproj
    tools/Majorsilence.Forms.Templates/Majorsilence.Forms.Templates.csproj
    tools/Majorsilence.Forms.Migrator/Majorsilence.Forms.Migrator.csproj
    tools/Majorsilence.Forms.Mcp/Majorsilence.Forms.Mcp.csproj
    src/Majorsilence.Forms.WinFormsShims.Compat/Majorsilence.Forms.WinFormsShims.Compat.csproj
  # Windows-only packages (net*-windows, UseWindowsForms/UseWPF). Off Windows these
  # projects compile to an empty IsPackable=false placeholder, so they must be packed
  # on a windows-latest runner (see the pack-windows job).
  PACKABLE_PROJECTS_WINDOWS: >-
    src/Majorsilence.Forms.WinForms/Majorsilence.Forms.WinForms.csproj
    src/Majorsilence.Forms.WindowsFormsInterop/Majorsilence.Forms.WindowsFormsInterop.csproj
    src/Majorsilence.Forms.WindowsUIAutomation/Majorsilence.Forms.WindowsUIAutomation.csproj
    src/Majorsilence.Forms.Theming.WinForms/Majorsilence.Forms.Theming.WinForms.csproj

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version once so every package + binary shares it.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag like refs/tags/v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            # Fall back to whatever the csproj files declare.
            VERSION=""
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: '${VERSION:-(from csproj)}'"

  # ---------------------------------------------------------------------------
  # Pack the NuGet packages. Platform-agnostic, so a single runner is enough --
  # it just needs the `android` workload installed, since Majorsilence.Forms.Avalonia
  # is packed with EnableAndroidTarget=true below to include a net10.0-android asset
  # (that TFM's reference assemblies are required just to compile, same reason CI's
  # separate `android` job in dotnet.yml needs the workload).
  # ---------------------------------------------------------------------------
  pack:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install android workload
        run: dotnet workload install android

      - name: Build version arg
        id: args
        shell: bash
        run: |
          if [ -n "${{ needs.version.outputs.version }}" ]; then
            echo "version_arg=-p:Version=${{ needs.version.outputs.version }} -p:PackageVersion=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for proj in $PACKABLE_PROJECTS; do
            echo "::group::pack $proj"
            # Majorsilence.Forms.Avalonia's net10.0-android TFM row is opt-in (see that csproj's
            # TargetFrameworks comment) so a plain `dotnet build`/`dotnet pack` elsewhere never needs
            # the android workload; the released package still needs to include it, so it's the one
            # project here packed with EnableAndroidTarget=true.
            extra_args=""
            if [[ "$proj" == *Majorsilence.Forms.Avalonia.csproj ]]; then
              extra_args="-p:EnableAndroidTarget=true"
            fi
            dotnet pack "$proj" \
              --configuration Release \
              --output "${{ github.workspace }}/nupkg" \
              ${{ steps.args.outputs.version_arg }} $extra_args
            echo "::endgroup::"
          done

      - name: List packages
        shell: bash
        run: ls -lh "${{ github.workspace }}/nupkg"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: symbol-packages
          path: nupkg/*.snupkg
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Pack the Windows-only NuGet packages. These target net*-windows with
  # UseWindowsForms / UseWPF, so they only build on a Windows runner -- the Linux
  # `pack` job above sees them as empty IsPackable=false placeholders.
  # ---------------------------------------------------------------------------
  pack-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build version arg
        id: args
        shell: bash
        run: |
          if [ -n "${{ needs.version.outputs.version }}" ]; then
            echo "version_arg=-p:Version=${{ needs.version.outputs.version }} -p:PackageVersion=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack Windows-only NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for proj in $PACKABLE_PROJECTS_WINDOWS; do
            echo "::group::pack $proj"
            dotnet pack "$proj" \
              --configuration Release \
              --output "${{ github.workspace }}/nupkg" \
              ${{ steps.args.outputs.version_arg }}
            echo "::endgroup::"
          done

      - name: List packages
        # windows-latest defaults `run:` to PowerShell, where `ls` is Get-ChildItem and
        # `-lh` is not a valid parameter, so this step failed even when the pack above it
        # succeeded. Pin bash, the way the pack steps already do.
        shell: bash
        run: ls -lh "${{ github.workspace }}/nupkg"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-windows
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: symbol-packages-windows
          path: nupkg/*.snupkg
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build the runnable sample heads (the ControlGallery on each mobile/web target)
  # and attach them to the release so people can try the framework without a
  # toolchain: a static WASM site, a sideloadable Android APK/AAB, an iOS
  # simulator .app. None are code-signed for distribution.
  # ---------------------------------------------------------------------------
  sample-wasm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Publish Gallery.Wasm
        run: >-
          dotnet publish samples/Gallery.Wasm/Gallery.Wasm.csproj
          --configuration Release -p:CompressionEnabled=false
          -o "${{ github.workspace }}/wasm-out"
      - name: Zip the WASM site
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          cd "${{ github.workspace }}/wasm-out/wwwroot"
          zip -r "${{ github.workspace }}/gallery-wasm${V:+-$V}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: sample-wasm
          path: gallery-wasm*.zip
          if-no-files-found: error

  sample-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install android workload
        run: dotnet workload install android
      # -p:EnableAndroidTarget=true, not the EnableMobileHeads umbrella: see the android job in
      # dotnet.yml. The umbrella also drags in ios and is self-gated on workload detection; this is the
      # ungated force for the one platform this runner installed.
      - name: Publish Gallery.Android
        run: >-
          dotnet publish samples/Gallery.Android/Gallery.Android.csproj
          -p:EnableAndroidTarget=true --configuration Release
          "-p:AndroidPackageFormats=apk%3Baab"
      - name: Collect APK/AAB
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          out="samples/Gallery.Android/bin/Release/net10.0-android"
          mkdir -p android
          cp "$out"/*-Signed.apk "android/gallery-android${V:+-$V}.apk"
          cp "$out"/*-Signed.aab "android/gallery-android${V:+-$V}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-android
          path: android/*
          if-no-files-found: error

  sample-ios:
    needs: version
    runs-on: macos-latest
    # See the ios job in dotnet.yml: the head compiles, but iOS has only a couple of green runs and
    # nobody has run it on a device. Do not fail the release for it until it is proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install ios workload
        run: dotnet workload install ios
      # `dotnet build` (not publish) with a simulator RID: iOS `publish` refuses a simulator RID.
      # -p:EnableIOSTarget=true names the one platform this runner has a workload for; the
      # EnableMobileHeads umbrella would pull the net10.0-android row in too and fail with NETSDK1147.
      - name: Build Gallery.iOS (simulator)
        run: >-
          dotnet build samples/Gallery.iOS/Gallery.iOS.csproj
          -p:EnableIOSTarget=true --configuration Release
          -p:RuntimeIdentifier=iossimulator-arm64
      - name: Zip the simulator .app
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          APP=$(find samples/Gallery.iOS/bin/Release -name 'Gallery.iOS.app' -type d | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "gallery-ios-simulator${V:+-$V}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-ios
          path: gallery-ios-simulator*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Theme Studio zips. Both heads are self-contained (no .NET runtime required to
  # run them) so a reviewer can download, unzip, and try the CSS theme editor
  # (docs/samples.md) with no toolchain installed.
  #
  # ThemeStudio (Avalonia) is cross-platform, so it's published once per RID on a
  # runner that natively matches it -- win-x64 on windows-latest, linux-x64 on
  # ubuntu-latest, osx-arm64 on macos-latest (macos-latest is Apple Silicon) --
  # the same "build where it ships" approach as sample-android / sample-ios above,
  # rather than cross-publishing.
  # ---------------------------------------------------------------------------
  sample-themestudio:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # -p:EnableMobileHeads=false: windows-latest ships the android workload's SDK pack
      # preinstalled, which auto-adds a net10.0-android row to Majorsilence.Forms.Avalonia
      # (see Directory.Build.props' EnableAndroidHead detection) -- fine for a plain
      # `dotnet build`, but a self-contained `dotnet publish -r win-x64` then tries to
      # restore a Mono runtime pack for that TFM against the win-x64 RID, which doesn't
      # exist (NU1102: Microsoft.NETCore.App.Runtime.Mono.win-x64). ThemeStudio never
      # targets android, so force the row off explicitly rather than relying on runner
      # image contents.
      - name: Publish ThemeStudio (${{ matrix.rid }}, self-contained)
        run: >-
          dotnet publish samples/ThemeStudio/ThemeStudio.csproj
          --configuration Release -r ${{ matrix.rid }} --self-contained true
          -p:EnableMobileHeads=false
          -o "${{ github.workspace }}/themestudio-out"
      # zip isn't on the GitHub-hosted windows-latest image (Git Bash has no `zip`), so
      # Windows uses PowerShell's Compress-Archive instead.
      - name: Zip ThemeStudio (${{ matrix.rid }}, Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          cd "${{ github.workspace }}/themestudio-out"
          zip -r "${{ github.workspace }}/themestudio-${{ matrix.rid }}${V:+-$V}.zip" .
      - name: Zip ThemeStudio (${{ matrix.rid }}, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $suffix = if ($v) { "-$v" } else { "" }
          Compress-Archive -Path "${{ github.workspace }}\themestudio-out\*" `
            -DestinationPath "${{ github.workspace }}\themestudio-${{ matrix.rid }}$suffix.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-themestudio-${{ matrix.rid }}
          path: themestudio-*.zip
          if-no-files-found: error

  # ThemeStudio.WinForms only builds and runs on Windows (real System.Windows.Forms,
  # via Majorsilence.Forms.Theming.WinForms) -- one RID, no matrix needed.
  sample-themestudio-winforms:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish ThemeStudio.WinForms (win-x64, self-contained)
        run: >-
          dotnet publish samples/ThemeStudio.WinForms/ThemeStudio.WinForms.csproj
          --configuration Release -r win-x64 --self-contained true
          -o "${{ github.workspace }}/themestudio-winforms-out"
      # zip isn't on the GitHub-hosted windows-latest image (Git Bash has no `zip`), so
      # use PowerShell's Compress-Archive instead -- see the matching comment above.
      - name: Zip ThemeStudio.WinForms
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $suffix = if ($v) { "-$v" } else { "" }
          Compress-Archive -Path "${{ github.workspace }}\themestudio-winforms-out\*" `
            -DestinationPath "${{ github.workspace }}\themestudio-winforms-win-x64$suffix.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-themestudio-winforms
          path: themestudio-winforms-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # On a tag build (or manual dispatch with a version), collect everything into a
  # draft GitHub Release. Nothing here touches nuget.org -- see publish-nuget.yml.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, pack, pack-windows, sample-wasm, sample-android, sample-ios, sample-themestudio, sample-themestudio-winforms]
    runs-on: ubuntu-latest
    if: needs.version.outputs.is_release == 'true'
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.nupkg' -o -name '*.snupkg' -o -name '*.zip' -o -name '*.tar.gz' \
            -o -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} release/ \;
          ls -lh release

      # Publishing to nuget.org happens separately, in publish-nuget.yml, triggered by
      # `release: published` -- i.e. only after a human clicks "Publish release" on the
      # draft below. Nothing in this workflow can push a package to nuget.org.
      - name: Create GitHub Release (draft)
        if: needs.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Majorsilence.Forms ${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: true
          files: release/*
