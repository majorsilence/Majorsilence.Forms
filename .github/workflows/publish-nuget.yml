name: Publish to nuget.org

# Publishes the Majorsilence.Forms NuGet packages to nuget.org, using Trusted Publishing
# (OIDC) -- no long-lived API key is stored in this repo.
#
# Trigger: only when a human clicks "Publish release" on a GitHub Release (release.yml
# creates these as drafts on a tag push). Publishing a draft is the deliberate manual
# approval gate; nothing publishes to nuget.org just from pushing a tag or to main.
#
# One-time setup required on nuget.org (see MIGRATION-NOTES.md / repo docs):
#   1. nuget.org -> your username -> Trusted Publishing -> add policy
#        Repository Owner: majorsilence
#        Repository:       Majorsilence.Forms
#        Workflow File:     publish-nuget.yml
#        Environment:       (leave blank; this workflow doesn't use one)
#   2. No GitHub secret needed for the API key. NUGET_USER below can be a plain repo
#      variable (vars.NUGET_USER) or a secret if you'd rather not expose the nuget.org
#      username in workflow runs -- either works, it's not sensitive on its own.

on:
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Cross-platform packages — packed on Linux in the `publish` job.
  # Keep this in sync with PACKABLE_PROJECTS in release.yml and dotnet.yml (the `pack` job).
  PACKABLE_PROJECTS: >-
    src/Majorsilence.Forms/Majorsilence.Forms.csproj
    src/Majorsilence.Forms.Theming.Avalonia/Majorsilence.Forms.Theming.Avalonia.csproj
    src/Majorsilence.Forms.Headless/Majorsilence.Forms.Headless.csproj
    src/Majorsilence.Forms.Terminal/Majorsilence.Forms.Terminal.csproj
    src/Majorsilence.Forms.Mvvm/Majorsilence.Forms.Mvvm.csproj
    src/Majorsilence.Forms.Uno/Majorsilence.Forms.Uno.csproj
    src/Majorsilence.Forms.Gtk4/Majorsilence.Forms.Gtk4.csproj
    src/Majorsilence.Forms.Telerik/Majorsilence.Forms.Telerik.csproj
    src/Majorsilence.Forms.Drawing.Common/Majorsilence.Forms.Drawing.Common.csproj
    src/Majorsilence.Forms.WebDriver/Majorsilence.Forms.WebDriver.csproj
    src/Majorsilence.Forms.Wpf/Majorsilence.Forms.Wpf.csproj
    tools/Majorsilence.Forms.Templates/Majorsilence.Forms.Templates.csproj
    tools/Majorsilence.Forms.Migrator/Majorsilence.Forms.Migrator.csproj
    tools/Majorsilence.Forms.Mcp/Majorsilence.Forms.Mcp.csproj
    src/Majorsilence.Forms.WinFormsShims.Compat/Majorsilence.Forms.WinFormsShims.Compat.csproj
    src/Majorsilence.Forms.WinFormsShims.Compat.Drawing/Majorsilence.Forms.WinFormsShims.Compat.Drawing.csproj
    src/Majorsilence.Forms.WinFormsShims.Compat.Avalonia/Majorsilence.Forms.WinFormsShims.Compat.Avalonia.csproj
  # Windows-only packages (net*-windows, UseWindowsForms/UseWPF). Off Windows these
  # projects compile to an empty IsPackable=false placeholder, so they're packed on a
  # windows-latest runner (see the pack-windows job) and pushed alongside the rest.
  PACKABLE_PROJECTS_WINDOWS: >-
    src/Majorsilence.Forms.WinForms/Majorsilence.Forms.WinForms.csproj
    src/Majorsilence.Forms.WindowsFormsInterop/Majorsilence.Forms.WindowsFormsInterop.csproj
    src/Majorsilence.Forms.WindowsUIAutomation/Majorsilence.Forms.WindowsUIAutomation.csproj
    src/Majorsilence.Forms.Theming.WinForms/Majorsilence.Forms.Theming.WinForms.csproj
  # Packages that need a macOS runner because they carry a net10.0-ios row (Apple's toolchain is a hard
  # requirement). Majorsilence.Forms.Essentials and Majorsilence.Forms.Avalonia each ship android + ios +
  # desktop (+ browser, for Avalonia) in ONE package, so they are packed here with both workloads, and
  # deliberately not in PACKABLE_PROJECTS above (two packs of the same id would collide on nuget.org).
  # Packing Avalonia on Linux shipped every release without its net10.0-ios asset, so an iOS head
  # silently got the desktop build. Keep in sync with the other two workflows.
  PACKABLE_PROJECTS_MACOS: >-
    src/Majorsilence.Forms.Essentials/Majorsilence.Forms.Essentials.csproj
    src/Majorsilence.Forms.Avalonia/Majorsilence.Forms.Avalonia.csproj

jobs:
  # Windows-only packages build only on a Windows runner; pack them here and hand the
  # .nupkg/.snupkg files to the `publish` job as an artifact so the OIDC push stays in
  # one place.
  pack-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack Windows-only NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nupkg
          for proj in $PACKABLE_PROJECTS_WINDOWS; do
            echo "::group::pack $proj"
            dotnet pack "$proj" --configuration Release --output nupkg
            echo "::endgroup::"
          done
          ls -lh nupkg

      - name: Upload Windows-only packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-windows
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error

  # Packages with a net10.0-ios row build only on a macOS runner (Apple's toolchain). Same hand-off
  # as pack-windows. Not continue-on-error: failing here beats publishing Essentials or Avalonia
  # to nuget.org without its iOS asset, which could not be corrected later (versions are immutable).
  pack-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Pinned to workload set 10.0.401 (iOS 26.5.10318), same as the ios job in dotnet.yml: set 10.0.401.1
      # brought .NET for iOS 27.0, which refuses to build without Xcode 27, and the macos runner image
      # still ships Xcode 26.6. Drop the pin when that job's does. android and ios go in together so
      # the Essentials and Avalonia packages carry both rows.
      - name: Install android and ios workloads
        run: dotnet workload install android ios --version 10.0.401

      - name: Pack macOS-only NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nupkg
          for proj in $PACKABLE_PROJECTS_MACOS; do
            echo "::group::pack $proj"
            dotnet pack "$proj" --configuration Release --output nupkg \
              -p:EnableAndroidTarget=true -p:EnableIOSTarget=true
            echo "::endgroup::"
          done
          ls -lh nupkg

      - name: Upload macOS-only packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-macos
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error

  publish:
    needs: [pack-windows, pack-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet/login's OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the exact tag the release points at, not whatever HEAD happens to
          # be -- release.yml already validated this tag builds the released artifacts.
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Majorsilence.Forms.Avalonia itself is packed in pack-macos (it carries a net10.0-ios row), but
      # Majorsilence.Forms.Theming.Avalonia still builds against it here; with the workload installed
      # that build resolves the same android row the published package has.
      - name: Install android workload
        run: dotnet workload install android

      - name: Pack NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nupkg
          for proj in $PACKABLE_PROJECTS; do
            echo "::group::pack $proj"
            dotnet pack "$proj" --configuration Release --output nupkg
            echo "::endgroup::"
          done
          ls -lh nupkg

      - name: Download Windows-only packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg-windows
          path: nupkg

      - name: Download macOS-only packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg-macos
          path: nupkg

      - name: List all packages to push
        run: ls -lh nupkg

      # Exchanges this job's short-lived GitHub OIDC token for a ~1-hour nuget.org API
      # key, per the Trusted Publishing policy configured on nuget.org (see header comment).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
