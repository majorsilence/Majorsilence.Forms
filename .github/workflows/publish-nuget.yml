name: Publish to nuget.org

# Publishes the Majorsilence.Forms NuGet packages to nuget.org, using Trusted Publishing
# (OIDC) -- no long-lived API key is stored in this repo.
#
# Trigger: only when a human clicks "Publish release" on a GitHub Release (release.yml
# creates these as drafts on a tag push). Publishing a draft is the deliberate manual
# approval gate; nothing publishes to nuget.org just from pushing a tag or to main.
#
# One-time setup required on nuget.org (see MIGRATION-NOTES.md / repo docs):
#   1. nuget.org -> your username -> Trusted Publishing -> add policy
#        Repository Owner: majorsilence
#        Repository:       Majorsilence.Forms
#        Workflow File:     publish-nuget.yml
#        Environment:       (leave blank; this workflow doesn't use one)
#   2. No GitHub secret needed for the API key. NUGET_USER below can be a plain repo
#      variable (vars.NUGET_USER) or a secret if you'd rather not expose the nuget.org
#      username in workflow runs -- either works, it's not sensitive on its own.
#
# Packing is the same `Pack` target release.yml and dotnet.yml run (build/build.cs), one job per OS because
# each OS can only pack its own share (Windows-only projects, the packages with a net10.0-ios row, the rest);
# the project lists are in that file. The push itself deliberately stays here, in YAML, next to the OIDC login
# that produces its key.
#
# This checks out and builds from the release's TAG, so build/build.cs must exist at that tag: a release
# tagged before the Cake build landed cannot be published by this workflow.

on:
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  # The Windows-only and macOS-only packages build only on their own OS; pack them there and hand the
  # .nupkg/.snupkg files to the `publish` job as artifacts so the OIDC push stays in one place.
  #
  # Not continue-on-error, macOS especially: failing here beats publishing Essentials or Avalonia to nuget.org
  # without its iOS asset, which could not be corrected later (versions are immutable).
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            workloads: none
            artifact: nupkg-windows
          - os: macos-latest
            workloads: mac-pack
            artifact: nupkg-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Pack this OS's NuGet packages
        run: dotnet build/build.cs -- --target=Pack --workloads=${{ matrix.workloads }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error

  publish:
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet/login's OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the exact tag the release points at, not whatever HEAD happens to
          # be -- release.yml already validated this tag builds the released artifacts.
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      # Majorsilence.Forms.Avalonia itself is packed in the macOS job (it carries a net10.0-ios row), but
      # Majorsilence.Forms.Theming.Avalonia still builds against it here; with the android workload installed
      # that build resolves the same android row the published package has.
      - name: Pack the cross-platform NuGet packages
        run: dotnet build/build.cs -- --target=Pack --workloads=android

      - name: Download Windows-only packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg-windows
          path: nupkg

      - name: Download macOS-only packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg-macos
          path: nupkg

      - name: List all packages to push
        run: ls -lh nupkg

      # Exchanges this job's short-lived GitHub OIDC token for a ~1-hour nuget.org API
      # key, per the Trusted Publishing policy configured on nuget.org (see header comment).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          set -euo pipefail
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
