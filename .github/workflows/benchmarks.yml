name: Benchmarks

# Full BenchmarkDotNet runs on demand, so timings come from one consistent kind of machine rather than a
# laptop on battery. Results (markdown, CSV, JSON, HTML) are uploaded as the `benchmark-results` artifact.
# The per-PR smoke run and allocation gate are the `benchmarks` job in dotnet.yml; docs/performance-plan.md
# describes how the numbers are used. The run itself is the BenchmarkRun target in build/build.cs.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter glob, e.g. '*TextMeasure*'"
        required: false
        default: "*"
      job:
        description: "BenchmarkDotNet --job (default, short, medium, long)"
        required: false
        default: "default"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install CJK and emoji fonts
        run: dotnet build/build.cs -- --target=Fonts

      # The dispatch inputs reach the build through the environment, not interpolated into a command line.
      - name: Run benchmarks
        env:
          BENCH_FILTER: ${{ inputs.filter }}
          BENCH_JOB: ${{ inputs.job }}
        run: dotnet build/build.cs -- --target=BenchmarkRun

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
